name: Build Edlide Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.ts'
      - '**.js'
      - 'package.json'
      - 'product.json'

jobs:
  build-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libxkbcommon-dev pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build React components
        run: npm run buildreact

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: src/vs/workbench/contrib/void/browser/react/out
          retention-days: 1

  build-windows-x64:
    runs-on: windows-2022
    needs: build-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.2

      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: src/vs/workbench/contrib/void/browser/react/out

      - name: Install dependencies
        run: npm ci

      - name: Build Edlide x64
        run: npm run gulp vscode-win32-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edlide-win32-x64
          path: ${{ github.workspace }}\\..\\VSCode-win32-x64
          retention-days: 5

  build-windows-arm64:
    runs-on: windows-2022
    needs: build-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.2

      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: src/vs/workbench/contrib/void/browser/react/out

      - name: Install dependencies
        run: npm ci

      - name: Build Edlide ARM64
        run: npm run gulp vscode-win32-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edlide-win32-arm64
          path: ${{ github.workspace }}\\..\\VSCode-win32-arm64
          retention-days: 5
